  #     - PORT=8080
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - REDIS_PASSWORD=${REDIS_PASSWORD:-vedorasecret}
  #     - FFMPEG_PATH=/usr/bin/ffmpeg
  #     - FFPROBE_PATH=/usr/bin/ffprobe
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  redis_data:
    driver: local
