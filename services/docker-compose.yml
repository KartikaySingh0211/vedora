services:
  redis:
    image: redis:7-alpine
    container_name: vedora-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-vedorasecret}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vedorasecret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Optional: Containerized API & FFmpeg Worker service
  # api:
  #   build: .
  #   container_name: vedora-api
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
